<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YNL — Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#111111; --muted:#767672; --faint:#A8A8A3;
    --bg:#FAFAF8; --card:#FFFFFF; --border:#E3E2DD; --surface:#F1F0EC; --amber:#F5F0DC;
  }
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);margin:0;padding:20px;
    -webkit-font-smoothing:antialiased;
  }
  .brand-row{display:flex;align-items:center;justify-content:center;margin:0 auto 28px;max-width:1400px;}
  .brand-row img{height:84px;width:auto;display:block;}
  .brand-divider{width:1px;height:28px;background:var(--ink);opacity:.2;}
  h1{font-size:21px;font-weight:500;margin:0;letter-spacing:-0.01em;}
  h2{font-size:13px;font-weight:600;margin:18px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.03em;}
  input,button,select,textarea{
    font-family:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--border);border-radius:4px;background:var(--card);color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);}
  button{background:var(--ink);color:#fff;border:none;cursor:pointer;font-weight:500;}
  button:hover{background:#000;}
  button.secondary{background:none;color:var(--ink);border:1px solid var(--ink);}
  button.secondary:hover{background:var(--surface);}
  .card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:22px;margin:0 auto 16px;max-width:1200px;}
  .card.narrow{max-width:420px;}
  .row{display:flex;flex-direction:column;gap:10px;max-width:360px;}
  .inline{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;}
  .error{color:#B23A3A;font-size:13px;margin:6px 0 0;}
  .msg{color:var(--ink);font-size:13px;margin:6px 0 0;}
  table{width:100%;border-collapse:collapse;}
  td,th{padding:9px 8px;border-top:1px solid var(--border);text-align:left;font-size:14px;}
  thead th{position:sticky;top:0;background:var(--ink);color:#fff;font-size:12px;font-weight:500;letter-spacing:0.02em;}
  .muted{color:var(--muted);font-size:13px;}
  .tabs{display:flex;gap:2px;margin-bottom:18px;border-bottom:1px solid var(--border);}
  .tab-btn{background:none;border:none;padding:9px 14px;font-size:14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-family:inherit;}
  .tab-btn.active{color:var(--ink);font-weight:600;border-bottom-color:var(--ink);}
  .scroll{max-height:520px;overflow-y:auto;border-radius:6px;border:1px solid var(--border);}
  .scroll table{border:none;}
  .cat-header{background:var(--surface);font-weight:600;font-size:11px;padding:7px 10px;letter-spacing:0.02em;}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;max-width:700px;}
  .modal-bg{position:fixed;inset:0;background:rgba(17,17,17,.45);display:none;align-items:flex-start;justify-content:center;padding-top:60px;z-index:10;overflow-y:auto;}
  .modal-bg.show{display:flex;}
  .modal{background:var(--card);border-radius:6px;padding:22px;width:380px;max-width:92vw;border:1px solid var(--border);margin-bottom:40px;}
  .modal label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px;}
  .modal input,.modal select{width:100%;}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
</style>
</head>

<div class="modal-bg" id="foodModalBg">
  <div class="modal">
    <h1 style="font-size:16px;">Agregar alimento (valores por 100 g)</h1>
    <label>Categoría</label>
    <input type="text" id="f_cat" placeholder="Ej. Cereales y tubérculos">
    <label>Nombre del alimento</label>

    <label>Estado</label>
    <input type="text" id="f_estado" placeholder="crudo, cocido, etc.">
    <label>Fuente</label>
    <input type="text" id="f_fuente" placeholder="USDA FDC / etiqueta / estimado">
    <div class="grid2" style="max-width:none;">
      <div><label>Kcal</label><input type="text" id="f_kcal"></div>
      <div><label>Proteína (g)</label><input type="text" id="f_prot"></div>
      <div><label>Carbohidratos (g)</label><input type="text" id="f_carb"></div>
      <div><label>Grasa (g)</label><input type="text" id="f_grasa"></div>
      <div><label>Fibra (g)</label><input type="text" id="f_fibra"></div>
    </div>

      <input type="text" id="f_unidad_label" placeholder="Ej. tajada, huevo mediano">
      <input type="text" id="f_unidad_gramos" placeholder="Peso (g)">
    </div>
    <div class="modal-actions">
      <button class="secondary" onclick="closeFoodModal()">Cancelar</button>
      <button onclick="saveFood()">Guardar</button>
    </div>
    <p class="error" id="foodModalErr"></p>
  </div>

<script>
const SUPABASE_URL = "https://thfnhfeysvomoiwdguvs.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_8b8P9eK5ZKgy4QFjF9KV0w_1LF37Jb-";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const app = document.getElementById('app');
let currentUserId = null;

async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if(session){
    showDashboard(session);
  } else {
    showLogin();
  }
}

function showLogin(){
  app.innerHTML = `
    <div class="card" style="max-width:420px;">
      <h1 style="margin-bottom:14px;">Iniciar sesión</h1>
      <div class="row">
        <input type="email" id="email" placeholder="Correo">
        <input type="password" id="password" placeholder="Contraseña">
        <div class="inline">
          <button onclick="login()">Entrar</button>
          <button class="secondary" onclick="signup()">Crear cuenta</button>
        </div>
        <p class="error" id="err"></p>
      </div>
    </div>
  `;
}

async function login(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ document.getElementById('err').textContent = error.message; return; }
  init();
}

async function signup(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const { error } = await sb.auth.signUp({ email, password });
  const err = document.getElementById('err');
  if(error){ err.textContent = error.message; return; }
  err.classList.remove('error'); err.classList.add('msg');
  err.textContent = 'Cuenta creada. Si Supabase pide confirmación por correo, revisa tu bandeja, confirma, y luego inicia sesión aquí.';
}

async function logout(){
  await sb.auth.signOut();
  init();
}

async function showDashboard(session){
  const userId = session.user.id;
  currentUserId = userId;
  const { data: profile } = await sb.from('profiles').select('*').eq('id', userId).single();

  if(!profile){
    app.innerHTML = `<div class="card" style="max-width:420px;"><p>No encontré tu perfil todavía. Si acabas de crear tu cuenta, espera unos segundos y recarga la página.</p><button class="secondary" onclick="logout()">Cerrar sesión</button></div>`;
    return;
  }

  if(profile.rol === 'entrenador'){
    await showEntrenadorDashboard(userId);
  } else {
    await showClienteDashboard(userId);
  }
}

async function showEntrenadorDashboard(userId){
  app.innerHTML = `
    <div class="card">
      <div class="inline">
        <h1>Panel del entrenador</h1>
        <button class="secondary" onclick="logout()">Cerrar sesión</button>
      </div>
      <div class="tabs">
        <button class="tab-btn active" id="tabBtnAsesorados" onclick="switchEntrenadorTab('asesorados','${userId}')">Asesorados</button>
        <button class="tab-btn" id="tabBtnAlimentos" onclick="switchEntrenadorTab('alimentos','${userId}')">Base de alimentos</button>
      </div>
      <div id="entrenadorTabContent">Cargando…</div>
    </div>
  `;
  await switchEntrenadorTab('asesorados', userId);
}

async function switchEntrenadorTab(tab, userId){
  document.getElementById('tabBtnAsesorados').classList.toggle('active', tab==='asesorados');
  document.getElementById('tabBtnAlimentos').classList.toggle('active', tab==='alimentos');
  if(tab === 'asesorados'){
    await renderAsesoradosTab(userId);
  } else {
    await renderAlimentosTab();
  }
}

async function renderAsesoradosTab(userId){
  const { data: clientes } = await sb.from('clientes').select('*').eq('entrenador_id', userId).order('nombre');
  let rows = (clientes||[]).map(c=>`<tr><td>${c.nombre}</td><td>${c.email||'—'}</td><td>${c.objetivo||'—'}</td><td>${c.auth_user_id ? 'Sí' : 'No'}</td></tr>`).join('');
  document.getElementById('entrenadorTabContent').innerHTML = `
    <div style="display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:start;">
      <div>
        <h2>Tus asesorados</h2>
        <div class="scroll"><table><thead><tr><th>Nombre</th><th>Correo</th><th>Objetivo</th><th>Ya entró</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="4" class="muted">Aún no tienes asesorados.</td></tr>'}</tbody></table></div>
      </div>
      <div>
        <h2>Agregar asesorado</h2>
        <div class="row" style="max-width:none;">
          <input type="text" id="newNombre" placeholder="Nombre">
          <input type="email" id="newEmail" placeholder="Correo (con el que él/ella se va a registrar)">
          <button onclick="addCliente('${userId}')">+ Agregar</button>
          <p class="muted">Una vez agregado, comparte con esa persona el link de esta página y pídele que se registre con ese mismo correo — así queda vinculada automáticamente a su perfil.</p>
        </div>
      </div>
    </div>
  `;
}

async function addCliente(userId){
  const nombre = document.getElementById('newNombre').value.trim();
  const email = document.getElementById('newEmail').value.trim();
  if(!nombre) return;
  await sb.from('clientes').insert({ entrenador_id: userId, nombre, email: email || null });
  renderAsesoradosTab(userId);
}

let alimentosCache = null;

async function renderAlimentosTab(){
  const content = document.getElementById('entrenadorTabContent');
  content.innerHTML = `
    <div class="inline" style="margin-bottom:10px;">
      <input type="text" id="foodSearch" placeholder="Buscar alimento..." style="flex:1;min-width:180px;" oninput="filterAlimentos()">
      <select id="foodCatFilter" onchange="filterAlimentos()"><option value="">Todas las categorías</option></select>
      <button onclick="openFoodModal()">+ Agregar alimento</button>
    </div>
    <div class="scroll">
      <table><thead><tr><th>Alimento</th><th>Kcal</th><th>Prot (g)</th><th>Carb (g)</th><th>Grasa (g)</th><th>Fibra (g)</th></tr></thead>
      <tbody id="foodTableBody"><tr><td colspan="6" class="muted">Cargando…</td></tr></tbody></table>
    </div>
  `;

  await loadAlimentos();
}

async function loadAlimentos(){
  const { data, error } = await sb.from('alimentos').select('*').order('categoria').order('nombre');
  if(error){
    document.getElementById('foodTableBody').innerHTML = `<tr><td colspan="6" class="muted">Error cargando: ${error.message}</td></tr>`;
    return;
  }
  alimentosCache = data;

  const cats = [...new Set(alimentosCache.map(f=>f.categoria))];
  const catSel = document.getElementById('foodCatFilter');
  if(catSel) catSel.innerHTML = '<option value="">Todas las categorías</option>' + cats.map(c=>`<option value="${c}">${c}</option>`).join('');

  renderFoodRows(alimentosCache);
}

function renderFoodRows(list){
  const byCat = {};
  list.forEach(f=>{ (byCat[f.categoria]=byCat[f.categoria]||[]).push(f); });
  let html = '';
  Object.keys(byCat).forEach(cat=>{
    html += `<tr><td colspan="6" class="cat-header">${cat}</td></tr>`;
    byCat[cat].forEach(f=>{
      html += `<tr><td>${f.nombre}${f.unidad_label ? `<br><span class="muted">1 ${f.unidad_label} ≈ ${f.unidad_gramos} g</span>` : ''}</td><td>${f.kcal}</td><td>${f.proteina}</td><td>${f.carbohidratos}</td><td>${f.grasa}</td><td>${f.fibra}</td></tr>`;
    });
  });
  document.getElementById('foodTableBody').innerHTML = html || '<tr><td colspan="6" class="muted">Sin resultados.</td></tr>';
}

function filterAlimentos(){
  if(!alimentosCache) return;
  const q = document.getElementById('foodSearch').value.trim().toLowerCase();
  const cat = document.getElementById('foodCatFilter').value;
  const filtered = alimentosCache.filter(f=>{
    const matchQ = !q || f.nombre.toLowerCase().includes(q);
    const matchC = !cat || f.categoria === cat;
    return matchQ && matchC;
  });
  renderFoodRows(filtered);
}

function slugify(name){
  return name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,'').toLowerCase();
}

function openFoodModal(){
  document.getElementById('foodModalErr').textContent = '';
  ['f_cat','f_nombre','f_estado','f_fuente','f_kcal','f_prot','f_carb','f_grasa','f_fibra','f_unidad_label','f_unidad_gramos'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('foodModalBg').classList.add('show');
}
function closeFoodModal(){ document.getElementById('foodModalBg').classList.remove('show'); }

async function saveFood(){
  const categoria = document.getElementById('f_cat').value.trim();
  const nombre = document.getElementById('f_nombre').value.trim();
  const num = (id)=>{ const v = parseFloat(document.getElementById(id).value.replace(',','.')); return isNaN(v) ? null : v; };
  const kcal = num('f_kcal'), prot = num('f_prot'), carb = num('f_carb'), grasa = num('f_grasa'), fibra = num('f_fibra');
  const err = document.getElementById('foodModalErr');

  if(!categoria || !nombre){ err.textContent = 'Escribe categoría y nombre.'; return; }
  if([kcal,prot,carb,grasa,fibra].some(v=>v===null)){ err.textContent = 'Completa los 5 valores numéricos por 100 g.'; return; }

  const unidadLabel = document.getElementById('f_unidad_label').value.trim();
  const unidadGramos = num('f_unidad_gramos');

  let id = slugify(nombre);
  const existing = (alimentosCache||[]).find(f=>f.id===id);
  if(existing) id = id + '_' + Date.now();

  const { error } = await sb.from('alimentos').insert({
    id, categoria, nombre,
    estado: document.getElementById('f_estado').value.trim() || null,
    fuente: document.getElementById('f_fuente').value.trim() || 'agregado por el entrenador',
    kcal, proteina: prot, carbohidratos: carb, grasa, fibra,
    unidad_label: unidadLabel || null,
    unidad_gramos: (unidadLabel && unidadGramos) ? unidadGramos : null,
    entrenador_id: currentUserId,
  });

  if(error){ err.textContent = error.message; return; }
  closeFoodModal();
  await loadAlimentos();
}

async function showClienteDashboard(userId){
  const { data: cliente } = await sb.from('clientes').select('*').eq('auth_user_id', userId).maybeSingle();
  app.innerHTML = `
    <div class="card" style="max-width:420px;">
      <div class="inline">
        <h1>Hola${cliente ? ', '+cliente.nombre : ''}</h1>
        <button class="secondary" onclick="logout()">Cerrar sesión</button>
      </div>
      <p class="muted">Tu registro de comidas, metas y peso se agregan en el siguiente paso.</p>
    </div>
  `;
}

window.login = login; window.signup = signup; window.logout = logout; window.addCliente = addCliente;
window.switchEntrenadorTab = switchEntrenadorTab; window.filterAlimentos = filterAlimentos;
window.openFoodModal = openFoodModal; window.closeFoodModal = closeFoodModal; window.saveFood = saveFood;

init();
</script>
</body>
</html>
