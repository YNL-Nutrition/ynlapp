
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="apple-touch-icon" href="icon_dark.png">
<link rel="icon" type="image/png" href="icon_dark.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="YNL">
<meta name="theme-color" content="#FAFAF8">

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>
  :root{
    --ink:#111111; --muted:#767672; --faint:#A8A8A3;
    --bg:#FAFAF8; --card:#FFFFFF; --border:#E3E2DD; --surface:#F1F0EC; --amber:#F5F0DC;
  }
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);margin:0;padding:20px;
    padding-top:calc(20px + env(safe-area-inset-top, 0px));
    padding-bottom:calc(20px + env(safe-area-inset-bottom, 0px));
    -webkit-font-smoothing:antialiased;
  }
  .brand-row{display:flex;align-items:center;justify-content:center;margin:0 auto 28px;max-width:1400px;}
  .brand-row img{height:128px;max-width:80%;width:auto;display:block;}
  .loading-state{min-height:55vh;display:flex;align-items:center;justify-content:center;}
  .loading-state img{height:44px;width:auto;display:block;animation:loadingPulse 1.4s ease-in-out infinite;}
  @keyframes loadingPulse{0%,100%{opacity:0.2;}50%{opacity:0.6;}}
  .te-tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
  .te-tab{flex:0 0 64px;text-align:center;padding:9px 0;border:1px solid var(--border);border-radius:5px;font-size:13px;cursor:pointer;background:#fff;color:var(--ink);}
  .te-tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .te-tab.te-add,.te-tab.te-remove{flex:0 0 40px;color:var(--muted);}
  .te-save.saved{background:none;color:var(--ink);border:1px solid var(--ink);}
  .te-row{display:flex;gap:10px;margin-bottom:12px;}
  .te-row .field{flex:1;}
  .te-row input{text-align:center;}
  .te-x{align-self:center;margin-top:18px;color:var(--muted);font-size:13px;}
  .te-refs{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);padding-top:10px;gap:10px;}
  .te-refs .k{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px;}
  .te-refs .v{font-size:13px;}
  h1{font-size:21px;font-weight:500;margin:0;letter-spacing:-0.01em;}
  h2{font-size:13px;font-weight:600;margin:18px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.03em;}
  input,button,select,textarea{
    font-family:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--border);border-radius:4px;background:var(--card);color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);}
  input:disabled{background:var(--card);color:var(--ink);border-color:var(--border);cursor:not-allowed;-webkit-text-fill-color:var(--ink);opacity:1;}
  select{appearance:none;-webkit-appearance:none;-moz-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M0 0l5 6 5-6z' fill='%23767672'/></svg>");background-repeat:no-repeat;background-position:right 10px center;padding-right:28px;}
  button{background:var(--ink);color:#fff;border:none;cursor:pointer;font-weight:500;}
  button:hover{background:#000;}
  button.secondary{background:none;color:var(--ink);border:1px solid var(--ink);}
  button.secondary:hover{background:var(--surface);}
  button.small{font-size:12px;padding:5px 9px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:22px;margin:0 auto 16px;max-width:1200px;width:100%;}
  .card.narrow{max-width:420px;}
  .row{display:flex;flex-direction:column;gap:10px;max-width:360px;}
  .inline{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;}
  input:not([type=checkbox]):not([type=radio]),select,textarea{width:100%;}
  .field{min-width:0;}
  .error{color:#B23A3A;font-size:13px;margin:6px 0 0;}
  .msg{color:var(--ink);font-size:13px;margin:6px 0 0;}
  table{width:100%;border-collapse:collapse;}
  td,th{padding:9px 8px;border-top:1px solid var(--border);text-align:left;font-size:14px;}
  thead th{position:sticky;top:0;background:var(--ink);color:#fff;font-size:12px;font-weight:500;letter-spacing:0.02em;}
  .muted{color:var(--muted);font-size:13px;}
  .tabs{display:flex;gap:2px;margin-top:18px;margin-bottom:18px;border-bottom:1px solid var(--border);}
  .tab-btn{background:none;border:none;padding:9px 14px;font-size:14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-family:inherit;}
  .tab-btn.active{background:var(--ink);color:#fff;font-weight:600;border-bottom-color:var(--ink);border-radius:4px 4px 0 0;}
  .scroll{max-height:420px;overflow-y:auto;border-radius:6px;border:1px solid var(--border);}
  .scroll table{border:none;}
  .cat-header,.meal-header{background:var(--surface);font-weight:600;font-size:11px;padding:7px 10px;letter-spacing:0.02em;}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:24px;max-width:none;}
  .modal-bg{position:fixed;inset:0;background:rgba(17,17,17,.45);display:none;align-items:flex-start;justify-content:center;padding-top:60px;z-index:10;overflow-y:auto;}
  .modal-bg.show{display:flex;}
  .modal{background:var(--card);border-radius:6px;padding:22px;width:380px;max-width:92vw;border:1px solid var(--border);margin-bottom:40px;}
  .modal label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px;}
  .modal input,.modal select{width:100%;}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
  .field label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px;}
  .portion-input{width:70px;}
  .charts-row{display:flex;gap:32px;flex-wrap:wrap;justify-content:center;}
  .chart-box{flex:0 0 220px;width:220px;text-align:center;}
  .chart-box h3{text-align:center;}
  .chart-wrap{position:relative;width:180px;height:180px;margin:0 auto;}
  @media (max-width:640px){
    .chart-wrap-wide{position:relative;height:220px;margin:14px 0;}
    .chart-wrap-wide + h2{margin-top:14px;}
    input[type=number]{-moz-appearance:textfield;}
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
    .num-stepper{position:relative;width:100%;}
    .num-stepper input[type=number]{width:100%;padding-right:24px;}
    .num-stepper .num-stepper-arrows{position:absolute;top:1px;right:1px;bottom:1px;width:20px;display:flex;flex-direction:column;}
    .num-stepper .num-stepper-btn{flex:1;min-height:0;padding:0;background:var(--card);color:var(--muted);border:none;border-left:1px solid var(--border);font-size:8px;line-height:1;display:flex;align-items:center;justify-content:center;}
    .num-stepper .num-stepper-btn:first-child{border-bottom:1px solid var(--border);border-radius:0 3px 0 0;}
    .num-stepper .num-stepper-btn:last-child{border-radius:0 0 3px 0;}
  }
  .chart-legend{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;font-size:11px;color:var(--muted);margin-top:10px;min-height:34px;}
  .chart-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;}
  .note-item{border:1px solid var(--border);border-radius:4px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .note-item .when{font-size:11px;color:var(--muted);margin-bottom:3px;}
  .note-item .txt{white-space:pre-wrap;font-size:14px;}
  .grid2 > .field{display:flex;flex-direction:column;justify-content:flex-end;}
  .chart-box h3{font-size:12px;color:var(--muted);margin:0 0 8px;}
</style>
</head>
<body>

<div class="brand-row" style="display:none;">
  <img src="logo.png" alt="YNL">
</div>

<div id="app">
  <div style="position:fixed;inset:0;background:#111;display:flex;align-items:center;justify-content:center;z-index:9999;">
    <img src="logo.png" alt="" style="height:60px;width:auto;filter:invert(1);animation:loadingPulse 1.4s ease-in-out infinite;">

</div>

<!-- ===================== MODAL: AGREGAR ALIMENTO ===================== -->
<div class="modal-bg" id="foodModalBg">
  <div class="modal">
    <h1 id="foodModalTitle" style="font-size:16px;">Agregar alimento (valores por 100 g)</h1>
    <label>Categoría</label>
    <select id="f_cat" onchange="onFoodCatChange()"></select>
    <input type="text" id="f_cat_nueva" placeholder="Nombre de la nueva categoría" style="display:none;margin-top:6px;">
    <label>Nombre del alimento</label>

    <label>Estado</label>
    <input type="text" id="f_estado" placeholder="crudo, cocido, etc.">
    <label>Fuente</label>
    <input type="text" id="f_fuente" placeholder="USDA FDC / etiqueta / estimado">
    <div class="grid2" style="max-width:none;">
      <div><label>Kcal</label><input type="text" id="f_kcal"></div>
      <div><label>Proteína (g)</label><input type="text" id="f_prot"></div>

<script>
const SUPABASE_URL = "https://thfnhfeysvomoiwdguvs.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_8b8P9eK5ZKgy4QFjF9KV0w_1LF37Jb-";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const app = document.getElementById('app');

function wrapNumberStepper(input){
  if(input.dataset.stepperWrapped) return;
  input.dataset.stepperWrapped = '1';
  const wrap = document.createElement('div');
  wrap.className = 'num-stepper';
  input.parentNode.insertBefore(wrap, input);
  wrap.appendChild(input);
  const arrows = document.createElement('div');
  arrows.className = 'num-stepper-arrows';
  const up = document.createElement('button');
  up.type = 'button'; up.className = 'num-stepper-btn'; up.textContent = '▲';
  const down = document.createElement('button');
  down.type = 'button'; down.className = 'num-stepper-btn'; down.textContent = '▼';
  const step = parseFloat(input.getAttribute('step')) || 1;
  const decimals = (input.getAttribute('step') || '').includes('.') ? input.getAttribute('step').split('.')[1].length : 0;
  function bump(dir){
    if(input.disabled) return;
    let v = parseFloat(input.value);
    if(isNaN(v)) v = 0;
    v = Math.round((v + dir*step) * Math.pow(10,decimals)) / Math.pow(10,decimals);
    if(input.min !== '' && v < parseFloat(input.min)) v = parseFloat(input.min);
    if(input.max !== '' && v > parseFloat(input.max)) v = parseFloat(input.max);
    input.value = v;
    input.dispatchEvent(new Event('change', {bubbles:true}));
  }
  up.onclick = ()=>bump(1);
  down.onclick = ()=>bump(-1);
  arrows.appendChild(up); arrows.appendChild(down); wrap.appendChild(arrows);
}
function initNumberSteppers(){
  if(!window.matchMedia('(max-width:640px)').matches) return;
  document.querySelectorAll('input[type=number]:not([data-stepper-wrapped]):not(:disabled)').forEach(wrapNumberStepper);
}
new MutationObserver(()=>initNumberSteppers()).observe(app, {childList:true, subtree:true});
initNumberSteppers();
let currentUserId = null;
let currentRole = null;
let alimentosCache = null;
let ejerciciosCache = null;
let editingExerciseId = null;
const GRUPOS_MUSCULARES = ['Abs','Bíceps','Cuádriceps','Deltoides','Espalda','Glúteo','Isquios','Pantorrilla','Pecho','Tríceps'];

// ---------- Auth ----------
async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if(session){ showDashboard(session); } else { showLogin(); }
}

function setBrandRowVisible(visible){
  const el = document.querySelector('.brand-row');
  if(el) el.style.display = visible ? '' : 'none';
}

function showLogin(){
  setBrandRowVisible(true);
  app.innerHTML = `
    <div class="card narrow">
      <h1 style="margin-bottom:14px;">Iniciar sesión</h1>
      <div class="row">
        <input type="email" id="email" placeholder="Correo">
        <input type="password" id="password" placeholder="Contraseña">
        <div class="inline">
          <button onclick="login()">Entrar</button>
          <button class="secondary" onclick="signup()">Crear cuenta</button>
        </div>
        <p class="error" id="err"></p>
      </div>
    </div>
  `;
}

async function login(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ document.getElementById('err').textContent = error.message; return; }
  init();
}

async function signup(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const { error } = await sb.auth.signUp({ email, password });
  const err = document.getElementById('err');
  if(error){ err.textContent = error.message; return; }
  err.classList.remove('error'); err.classList.add('msg');
  err.textContent = 'Cuenta creada. Si Supabase pide confirmación por correo, revisa tu bandeja, confirma, y luego inicia sesión aquí.';
}

async function logout(){
  await sb.auth.signOut();
  init();
}

async function showDashboard(session){
  const userId = session.user.id;
  currentUserId = userId;
  const { data: profile } = await sb.from('profiles').select('*').eq('id', userId).single();
  if(!profile){
    app.innerHTML = `<div class="card narrow"><p>No encontré tu perfil todavía. Si acabas de crear tu cuenta, espera unos segundos y recarga la página.</p><button class="secondary" onclick="logout()">Cerrar sesión</button></div>`;
    return;
  }
  currentRole = profile.rol;
  if(profile.rol === 'entrenador'){
    await showEntrenadorDashboard(userId);
  } else {
    const { data: cliente } = await sb.from('clientes').select('*').eq('auth_user_id', userId).maybeSingle();
    if(!cliente){
      app.innerHTML = `<div class="card narrow"><p>Aún no tienes un perfil de asesorado vinculado. Pídele a tu entrenador que te agregue con este correo.</p><button class="secondary" onclick="logout()">Cerrar sesión</button></div>`;
      return;
    }
    await renderClienteDetail(cliente.id, { isSelf:true, entrenadorUserId:null });
  }
}

// ---------- Panel entrenador: lista de asesorados ----------
async function showEntrenadorDashboard(userId){
  setBrandRowVisible(true);
  app.innerHTML = `
    <div class="card">
      <div class="inline">
        <h1>Panel del entrenador</h1>
        <button class="secondary" onclick="logout()">Cerrar sesión</button>
      </div>
      <div class="tabs">
        <button class="tab-btn active" id="tabBtnAsesorados" onclick="switchEntrenadorTab('asesorados','${userId}')">Asesorados</button>
        <button class="tab-btn" id="tabBtnAlimentos" onclick="switchEntrenadorTab('alimentos','${userId}')">Base de alimentos</button>
        <button class="tab-btn" id="tabBtnEjercicios" onclick="switchEntrenadorTab('ejercicios','${userId}')">Base de ejercicios</button>
      </div>
      <div id="entrenadorTabContent">Cargando…</div>
    </div>
  `;
  await switchEntrenadorTab('asesorados', userId);
}

async function switchEntrenadorTab(tab, userId){
  document.getElementById('tabBtnAsesorados').classList.toggle('active', tab==='asesorados');
  document.getElementById('tabBtnAlimentos').classList.toggle('active', tab==='alimentos');
  document.getElementById('tabBtnEjercicios').classList.toggle('active', tab==='ejercicios');
  if(tab === 'asesorados'){ await renderAsesoradosTab(userId); }
  else if(tab === 'alimentos'){ await renderAlimentosTab(); }
  else { await renderEjerciciosTab(); }
}

async function renderAsesoradosTab(userId){
  const { data: clientes } = await sb.from('clientes').select('*').eq('entrenador_id', userId).order('nombre');
  let rows = (clientes||[]).map(c=>`<tr>
      <td>${c.nombre}</td><td>${c.email||'—'}</td><td>${c.objetivo||'—'}</td><td>${c.auth_user_id ? 'Sí' : 'No'}</td>
      <td><button class="small secondary" onclick="renderClienteDetail('${c.id}', {isSelf:false, entrenadorUserId:'${userId}'})">Ver</button></td>
    </tr>`).join('');
  document.getElementById('entrenadorTabContent').innerHTML = `
    <div style="display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:start;">
      <div>
        <h2>Tus asesorados</h2>
        <div class="scroll"><table><thead><tr><th>Nombre</th><th>Correo</th><th>Objetivo</th><th>Ya entró</th><th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="5" class="muted">Aún no tienes asesorados.</td></tr>'}</tbody></table></div>
      </div>
      <div>
        <h2>Agregar asesorado</h2>
        <div class="row" style="max-width:none;">
          <input type="text" id="newNombre" placeholder="Nombre">
          <input type="email" id="newEmail" placeholder="Correo (con el que él/ella se va a registrar)">
          <button onclick="addCliente('${userId}')">+ Agregar</button>
          <p class="muted">Una vez agregado, comparte con esa persona el link de esta página y pídele que se registre con ese mismo correo — así queda vinculada automáticamente a su perfil.</p>
        </div>
      </div>
    </div>
  `;
}

async function addCliente(userId){
  const nombre = document.getElementById('newNombre').value.trim();
  const email = document.getElementById('newEmail').value.trim();
  if(!nombre) return;
  await sb.from('clientes').insert({ entrenador_id: userId, nombre, email: email || null });
  renderAsesoradosTab(userId);
}

// ---------- Base de alimentos (panel entrenador) ----------
async function renderAlimentosTab(){
  const content = document.getElementById('entrenadorTabContent');
  content.innerHTML = `
    <div class="inline" style="margin-bottom:10px;">
      <input type="text" id="foodSearch" placeholder="Buscar alimento..." style="flex:1;min-width:180px;" oninput="filterAlimentos()">

async function loadAlimentos(){
  const { data, error } = await sb.from('alimentos').select('*').order('categoria').order('nombre');
  if(error){
    const tb = document.getElementById('foodTableBody');
    if(tb) tb.innerHTML = `<tr><td colspan="7" class="muted">Error cargando: ${error.message}</td></tr>`;
    return;
  }
  alimentosCache = data;
  const catSel = document.getElementById('foodCatFilter');
  if(catSel){
    const cats = [...new Set(alimentosCache.map(f=>f.categoria))];
    catSel.innerHTML = '<option value="">Todas las categorías</option>' + cats.map(c=>`<option value="${c}">${c}</option>`).join('');
  }
  if(document.getElementById('foodTableBody')) renderFoodRows(alimentosCache);
}

function renderFoodRows(list){
  const byCat = {};
  list.forEach(f=>{ (byCat[f.categoria]=byCat[f.categoria]||[]).push(f); });
  let html = '';
  Object.keys(byCat).forEach(cat=>{
    html += `<tr><td colspan="7" class="cat-header">${cat}</td></tr>`;
    byCat[cat].forEach(f=>{
      html += `<tr><td>${f.nombre}${f.unidad_label ? `<br><span class="muted">1 ${f.unidad_label} ≈ ${f.unidad_gramos} g</span>` : ''}</td><td>${f.kcal}</td><td>${f.proteina}</td><td>${f.carbohidratos}</td><td>${f.grasa}</td><td>${f.fibra}</td><td style="white-space:nowrap;"><button class="small secondary" title="Editar" onclick="openEditFood('${f.id}')">✎</button> <button class="small secondary" title="Eliminar" onclick="confirmDeleteFood('${f.id}')">✕</button></td></tr>`;
    });
  });
  document.getElementById('foodTableBody').innerHTML = html || '<tr><td colspan="7" class="muted">Sin resultados.</td></tr>';
}

function filterAlimentos(){
  if(!alimentosCache) return;
  const q = document.getElementById('foodSearch').value.trim().toLowerCase();
  const cat = document.getElementById('foodCatFilter').value;
  const filtered = alimentosCache.filter(f=>{
    const matchQ = !q || f.nombre.toLowerCase().includes(q);
    const matchC = !cat || f.categoria === cat;
    return matchQ && matchC;
  });
  renderFoodRows(filtered);
}

function slugify(name){
  return name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,'').toLowerCase();
}

async function saveFood(){
  const catSelVal = document.getElementById('f_cat').value;
  const categoria = catSelVal === '__nueva__' ? document.getElementById('f_cat_nueva').value.trim() : catSelVal;
  const nombre = document.getElementById('f_nombre').value.trim();
  const num = (id)=>{ const v = parseFloat(document.getElementById(id).value.replace(',','.')); return isNaN(v) ? null : v; };
  const kcal = num('f_kcal'), prot = num('f_prot'), carb = num('f_carb'), grasa = num('f_grasa'), fibra = num('f_fibra');
  const err = document.getElementById('foodModalErr');
  if(!categoria || !nombre){ err.textContent = 'Escribe categoría y nombre.'; return; }
  if([kcal,prot,carb,grasa,fibra].some(v=>v===null)){ err.textContent = 'Completa los 5 valores numéricos por 100 g.'; return; }
  const unidadLabel = document.getElementById('f_unidad_label').value.trim();
  const unidadGramos = num('f_unidad_gramos');
  if(editingFoodId){
    const { data: upd, error: updErr } = await sb.from('alimentos').update({
      categoria, nombre,
      estado: document.getElementById('f_estado').value.trim() || null,
      fuente: document.getElementById('f_fuente').value.trim() || null,
      kcal, proteina: prot, carbohidratos: carb, grasa, fibra,
      unidad_label: unidadLabel || null,
      unidad_gramos: (unidadLabel && unidadGramos) ? unidadGramos : null,
    }).eq('id', editingFoodId).select();
    if(updErr){ err.textContent = updErr.message; return; }
    if(!upd || upd.length===0){ err.textContent = 'No se pudo actualizar (permisos). Corre el script ajustes_notas_y_permisos.sql en Supabase.'; return; }
    editingFoodId = null;
    closeFoodModal();
    await loadAlimentos();
    return;
  }
  let id = slugify(nombre);
  const existing = (alimentosCache||[]).find(f=>f.id===id);
  if(existing) id = id + '_' + Date.now();
  const { error } = await sb.from('alimentos').insert({
    id, categoria, nombre,
    estado: document.getElementById('f_estado').value.trim() || null,
    fuente: document.getElementById('f_fuente').value.trim() || 'agregado por el entrenador',
    kcal, proteina: prot, carbohidratos: carb, grasa, fibra,
    unidad_label: unidadLabel || null,
    unidad_gramos: (unidadLabel && unidadGramos) ? unidadGramos : null,
    entrenador_id: currentUserId,
  });
  if(error){ err.textContent = error.message; return; }
  closeFoodModal();
  await loadAlimentos();
}

function unlockAudio(){
  try{
    if(!vAudioCtx) vAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(vAudioCtx.state === 'suspended') vAudioCtx.resume();
    const o = vAudioCtx.createOscillator();
    const g = vAudioCtx.createGain();
    g.gain.value = 0.00001;
    o.connect(g); g.connect(vAudioCtx.destination);
    o.start(); o.stop(vAudioCtx.currentTime + 0.01);
  }catch(e){}
}

async function buildMiEntrenoExsHtml(dia, viewDate, isToday){
  const ejs = dia.ejercicios || [];
  const histResults = await Promise.all(ejs.map(re=>
    sb.from('registro_entreno').select('*').eq('cliente_id', vCliente.id).eq('ejercicio_id', re.ejercicio_id).order('fecha', { ascending:false }).order('numero_serie')
  ));

  if(!isToday){
    let html = '<div id="miEntrenoExs">';
    ejs.forEach((re, i)=>{
      const hist = histResults[i].data || [];
      const rows = hist.filter(h=>h.fecha===viewDate).sort((a,b)=>a.numero_serie-b.numero_serie);
      html += `<div class="card" style="margin-bottom:14px;padding:14px;">
        <strong style="display:block;text-align:center;">${re.ejercicios ? re.ejercicios.nombre : '—'}</strong>
        ${re.ejercicios && re.ejercicios.grupo_muscular ? `<div class="muted" style="text-align:center;margin-bottom:12px;">${re.ejercicios.grupo_muscular}</div>` : ''}
        ${rows.length ? `<div class="scroll"><table><thead><tr><th>Serie</th><th>Peso (kg)</th><th>Reps</th></tr></thead><tbody>
          ${rows.map(r=>`<tr><td>${r.numero_serie}</td><td>${r.peso ?? '—'}</td><td>${r.reps ?? '—'}</td></tr>`).join('')}
        </tbody></table></div>` : `<p class="muted" style="text-align:center;margin:0;">Sin registro este día.</p>`}
      </div>`;
    });
    if(!ejs.length) html += '<p class="muted">Este día no tiene ejercicios asignados.</p>';
    html += '</div>';
    return html;
  }

  const today = viewDate;
  miEntrenoState = {};
  ejs.forEach((re, i)=>{
    const hist = histResults[i].data || [];
    const todayRows = hist.filter(h=>h.fecha===today);
    const prevRows = hist.filter(h=>h.fecha!==today);
    const nSeries = Math.max(re.series || 3, todayRows.length || 0, 1);
    const series = [];
    for(let n=1; n<=nSeries; n++){
      const row = todayRows.find(t=>t.numero_serie===n);
      const prevForN = prevRows.filter(h=>h.numero_serie===n).sort((a,b)=> b.fecha.localeCompare(a.fecha))[0];
      series.push({
        peso: row ? row.peso : null,
        reps: row ? row.reps : null,
        prevLabel: prevForN ? `${prevForN.peso ?? '—'}kg × ${prevForN.reps ?? '—'}` : 'sin registro previo',
        saved: !!row,
        savedPeso: row ? row.peso : undefined,
        savedReps: row ? row.reps : undefined
      });
    }
    miEntrenoState[re.ejercicio_id] = { re, activeIndex: 0, series, expanded: false };
  });
  const header = entrenoTimerHeaderHtml();
  if(!ejs.length) return '<div id="miEntrenoExs">' + header + '<p class="muted">Este día no tiene ejercicios asignados todavía.</p></div>';
  return '<div id="miEntrenoExs">' + header + ejs.map(re=>renderEjercicioWidgetHtml(re.ejercicio_id)).join('') + '</div>';
}

  const allSaved = st.series.every(s=>s.saved);
  const head = `<div class="acc-head" onclick="toggleEjercicioExpand('${ej}')" style="display:flex;justify-content:space-between;align-items:center;padding:14px;cursor:pointer;">
    <div>
      <div style="font-weight:600;">${re.ejercicios ? re.ejercicios.nombre : '—'}${allSaved ? ' ✓' : ''}</div>
      <div class="muted" style="font-size:12px;">${re.ejercicios && re.ejercicios.grupo_muscular ? re.ejercicios.grupo_muscular+' · ' : ''}${st.series.length} serie${st.series.length===1?'':'s'}</div>
    </div>
    <span class="muted" style="font-size:12px;">${st.expanded ? '▴' : '▾'}</span>
  </div>`;

  if(!st.expanded){
    return `<div class="card" id="teCard_${ej}" style="margin-bottom:10px;padding:0;">${head}</div>`;
  }

  const tabsHtml = st.series.map((s,i)=>`<div class="te-tab${i===st.activeIndex?' active':''}" onclick="selectSerie('${ej}',${i})">Serie ${i+1}</div>`).join('')
    + `<div class="te-tab te-add" onclick="addSerie('${ej}')">+</div>`
    + (st.series.length>1 ? `<div class="te-tab te-remove" onclick="removeSerie('${ej}')">✕</div>` : '');
  const cur = st.series[st.activeIndex];
  return `<div class="card" id="teCard_${ej}" style="margin-bottom:10px;padding:0;">
    ${head}
    <div style="padding:0 14px 14px;border-top:1px solid var(--border);padding-top:14px;">
      <div class="te-tabs">${tabsHtml}</div>
      <div class="te-row">
        <div class="field"><label>Peso (kg)</label><input type="number" step="0.5" id="tePeso_${ej}" value="${cur.peso ?? ''}"></div>
        <div class="te-x">×</div>
        <div class="field"><label>Reps</label><input type="number" id="teReps_${ej}" value="${cur.reps ?? ''}"></div>
      </div>
      <div class="te-refs" style="margin-bottom:12px;">
        <div><span class="k">Última vez</span><span class="v">${cur.prevLabel}</span></div>
      </div>
      <button class="te-save${cur.saved ? ' saved' : ''}" style="width:100%;" onclick="guardarSerie('${ej}')">${cur.saved ? 'Guardado ✓' : '✓'}</button>
    </div>
  </div>`;

// ---------- Cronómetro general del entrenamiento ----------
function entrenoTimerKey(){

}

function entrenoTimerHeaderHtml(){

function restBarHtml(){
  return `<div style="position:fixed;left:20px;right:20px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:380px;margin:0 auto;background:var(--card);border:1px solid var(--border);border-radius:6px;box-shadow:0 -4px 14px rgba(0,0,0,0.1);padding:10px 14px;display:flex;align-items:center;gap:10px;z-index:500;">
    <span class="muted" style="font-size:11px;">Descanso</span>
    <input type="number" id="restMin" step="0.5" min="0.5" value="${vRestDurationSeconds ? (vRestDurationSeconds/60) : ''}" style="width:50px;padding:6px 8px;font-size:13px;" onchange="setRestDuration(this.value)">
    <span id="restCountdown" style="font-size:16px;font-weight:600;min-width:46px;">${vRestRemainingSeconds ? formatMinSec(vRestRemainingSeconds) : '--:--'}</span>
    <button onclick="playRestTimer()" title="Iniciar" style="background:none;border:none;padding:4px;cursor:pointer;display:flex;">
      <svg width="15" height="15" viewBox="0 0 16 16"><polygon points="3,2 14,8 3,14" fill="#111"/></svg>
    </button>
    <button onclick="pauseRestTimer()" title="Pausar" style="background:none;border:none;padding:4px;cursor:pointer;display:flex;">
      <svg width="15" height="15" viewBox="0 0 16 16"><rect x="4" y="2" width="3" height="12" fill="#111"/><rect x="9" y="2" width="3" height="12" fill="#111"/></svg>
    </button>
    <button onclick="restartRestTimer()" title="Reiniciar" style="background:none;border:none;padding:4px;cursor:pointer;display:flex;">
      <svg width="15" height="15" viewBox="0 0 16 16"><path d="M13 8A5 5 0 1 1 8 3" stroke="#111" stroke-width="1.6" fill="none"/><polygon points="8,0 8,5 11,2.5" fill="#111"/></svg>
    </button>
    <button onclick="hideRestBar()" title="Cerrar" style="margin-left:auto;background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:4px;">✕</button>
  </div>`;
}

function showRestBar(){
  const wrap = document.getElementById('restBarWrap');
  if(wrap) wrap.innerHTML = restBarHtml();
}

function hideRestBar(){
  const wrap = document.getElementById('restBarWrap');
  if(wrap) wrap.innerHTML = '';
}

function formatMinSec(secs){
  const m = String(Math.floor(secs/60)).padStart(2,'0');
  const s = String(secs%60).padStart(2,'0');
  return `${m}:${s}`;
}

function ensureEntrenoTimerStarted(){
  if(vEntrenoTimerInterval) return;
  const key = entrenoTimerKey();
  let start = parseInt(localStorage.getItem(key));
  if(!start){
    start = Date.now();
    localStorage.setItem(key, String(start));
  }
  vEntrenoTimerStart = start;
  tickEntrenoTimer();
  vEntrenoTimerInterval = setInterval(tickEntrenoTimer, 1000);
  showRestBar();
}

function tickEntrenoTimer(){
  const el = document.getElementById('entrenoDuracion');
  if(!el || !vEntrenoTimerStart){ clearEntrenoTimer(); return; }
  const secs = Math.floor((Date.now() - vEntrenoTimerStart) / 1000);
  const h = String(Math.floor(secs/3600)).padStart(2,'0');
  const m = String(Math.floor((secs%3600)/60)).padStart(2,'0');
  const s = String(secs%60).padStart(2,'0');
  el.textContent = `${h}:${m}:${s}`;
}

function clearEntrenoTimer(){
  if(vEntrenoTimerInterval){ clearInterval(vEntrenoTimerInterval); vEntrenoTimerInterval = null; }
  vEntrenoTimerStart = null;
}

// ---------- Timer de descanso con timbre ----------
function setRestDuration(val){
  const min = parseFloat(val);
  vRestDurationSeconds = (min > 0) ? Math.round(min*60) : null;
  if(!vRestTimerEnd){
    vRestRemainingSeconds = vRestDurationSeconds;
    updateRestDisplay();
  }
}

function playRestTimer(){
  unlockAudio();
  if(vRestRemainingSeconds == null || vRestRemainingSeconds <= 0){
    if(!vRestDurationSeconds) return;
    vRestRemainingSeconds = vRestDurationSeconds;
  }
  showRestBar();
  vRestTimerEnd = Date.now() + vRestRemainingSeconds*1000;
  if(vRestTimerInterval) clearInterval(vRestTimerInterval);
  vRestTimerInterval = setInterval(tickRestTimer, 250);
  tickRestTimer();
}

function pauseRestTimer(){
  if(!vRestTimerEnd) return;
  vRestRemainingSeconds = Math.max(0, Math.ceil((vRestTimerEnd - Date.now())/1000));
  clearInterval(vRestTimerInterval); vRestTimerInterval = null;
  vRestTimerEnd = null;
  updateRestDisplay();
}

function restartRestTimer(){
  if(!vRestDurationSeconds) return;
  vRestRemainingSeconds = vRestDurationSeconds;
  playRestTimer();
}

function tickRestTimer(){
  if(!vRestTimerEnd) return;
  const left = Math.max(0, Math.ceil((vRestTimerEnd - Date.now())/1000));
  vRestRemainingSeconds = left;
  updateRestDisplay();
  if(left <= 0){
    clearInterval(vRestTimerInterval); vRestTimerInterval = null;
    vRestTimerEnd = null;
    playTimbre();
  }
}

function updateRestDisplay(){
  const el = document.getElementById('restCountdown');
  if(!el) return;
  el.textContent = (vRestRemainingSeconds != null) ? formatMinSec(vRestRemainingSeconds) : '--:--';
}

function autoStartRestAfterSerie(){
  if(!vRestDurationSeconds) return;
  vRestRemainingSeconds = vRestDurationSeconds;
  playRestTimer();
}

function playTimbre(){
  try{
    unlockAudio();
    const ctx = vAudioCtx;
    if(!ctx) return;
    [0, 0.25].forEach(delay=>{
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, ctx.currentTime + delay);
      g.gain.exponentialRampToValueAtTime(0.35, ctx.currentTime + delay + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + 0.22);
      o.start(ctx.currentTime + delay);
      o.stop(ctx.currentTime + delay + 0.25);
    });
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([150,80,150]);
}

async function guardarSerie(ej){
  unlockAudio();
  captureSerieInputs(ej);
  const st = miEntrenoState[ej];
  const idx = st.activeIndex;
  const s = st.series[idx];
  const today = todayStr();
  const dia = vHoyDia;
  await sb.from('registro_entreno').delete().eq('cliente_id', vCliente.id).eq('fecha', today).eq('dia_id', dia.id).eq('ejercicio_id', ej).eq('numero_serie', idx+1);
  if(s.peso !== null || s.reps !== null){
    await sb.from('registro_entreno').insert({ cliente_id: vCliente.id, fecha: today, dia_id: dia.id, ejercicio_id: ej, numero_serie: idx+1, peso: s.peso, reps: s.reps });
    s.saved = true;
    s.savedPeso = s.peso; s.savedReps = s.reps;
    autoStartRestAfterSerie();
  } else {
    s.saved = false;
  }
  if(idx + 1 < st.series.length) st.activeIndex = idx + 1;
  refreshEjercicioWidget(ej);
}

function captureSerieInputs(ej){
  const st = miEntrenoState[ej];
  const pesoInp = document.getElementById('tePeso_'+ej);
  const repsInp = document.getElementById('teReps_'+ej);
  if(!pesoInp || !repsInp) return;
  const cur = st.series[st.activeIndex];
  cur.peso = pesoInp.value === '' ? null : parseFloat(pesoInp.value);
  cur.reps = repsInp.value === '' ? null : parseInt(repsInp.value);
  if(cur.saved && (cur.peso !== cur.savedPeso || cur.reps !== cur.savedReps)) cur.saved = false;
}

function refreshEjercicioWidget(ej){
  document.getElementById('teCard_'+ej).outerHTML = renderEjercicioWidgetHtml(ej);
}

function selectSerie(ej, idx){
  captureSerieInputs(ej);
  miEntrenoState[ej].activeIndex = idx;
  refreshEjercicioWidget(ej);
}

function addSerie(ej){
  captureSerieInputs(ej);
  miEntrenoState[ej].series.push({ peso:null, reps:null, prevLabel:'sin registro previo' });
  miEntrenoState[ej].activeIndex = miEntrenoState[ej].series.length - 1;
  refreshEjercicioWidget(ej);
}

function removeSerie(ej){
  const st = miEntrenoState[ej];
  if(st.series.length <= 1) return;
  st.series.splice(st.activeIndex, 1);
  st.activeIndex = Math.max(0, st.activeIndex - 1);
  refreshEjercicioWidget(ej);
}

async function guardarProgresoDia(avanzar){
  const dia = vHoyDia;
  const today = todayStr();
  if(dia.tipo === 'gym'){
    Object.keys(miEntrenoState).forEach(ej=>captureSerieInputs(ej));
    const rows = [];
    Object.entries(miEntrenoState).forEach(([ej, st])=>{
      st.series.forEach((s, i)=>{
        if(s.peso !== null || s.reps !== null){
          rows.push({ cliente_id: vCliente.id, fecha: today, dia_id: dia.id, ejercicio_id: ej, numero_serie: i+1, peso: s.peso, reps: s.reps });
        }
      });
    });
    await sb.from('registro_entreno').delete().eq('cliente_id', vCliente.id).eq('fecha', today).eq('dia_id', dia.id);
    if(rows.length) await sb.from('registro_entreno').insert(rows);
  } else {
    const num = (id)=>{ const v = parseFloat(document.getElementById(id).value); return isNaN(v) ? null : v; };
    const payload = {
      cliente_id: vCliente.id, fecha: today, dia_id: dia.id,
      distancia_km: num('rr_distancia'), tiempo_min: num('rr_tiempo'),
      pace: document.getElementById('rr_pace').value.trim() || null,
      fc_promedio: num('rr_fc'), cadencia: num('rr_cadencia'),
      notas: document.getElementById('rr_notas').value.trim() || null,
    };
    await sb.from('registro_running').delete().eq('cliente_id', vCliente.id).eq('fecha', today).eq('dia_id', dia.id);
    await sb.from('registro_running').insert(payload);
  }
  if(avanzar){
    const idx = vRutinaDias.findIndex(d=>d.id===dia.id);
    const nextValue = ((idx + 1) % vRutinaDias.length) + 1;
    await sb.from('clientes').update({ entreno_dia_actual: nextValue }).eq('id', vCliente.id);
    vCliente.entreno_dia_actual = nextValue;
  }
  await renderMiEntrenamiento();
}

function calcularMacros(){
  const kcal = parseFloat(document.getElementById('g_kcal').value);
  const peso = parseFloat(document.getElementById('calc_peso').value);
  const protGkg = parseFloat(document.getElementById('calc_prot_gkg').value);
  const grasaGkg = parseFloat(document.getElementById('calc_grasa_gkg').value);
  const fibraFactor = parseFloat(document.getElementById('calc_fibra_factor').value);
  const warn = document.getElementById('calcWarning');
  if(!kcal || kcal<=0 || !peso || peso<=0 || isNaN(protGkg) || isNaN(grasaGkg) || isNaN(fibraFactor)){
    alert('Completa kcal (arriba), peso y los factores de cálculo.'); return;
  }
  const prot = peso*protGkg, grasa = peso*grasaGkg;
  const carb = (kcal - prot*4 - grasa*9)/4;
  const fibra = kcal/1000*fibraFactor;
  document.getElementById('g_prot').value = Math.round(prot*10)/10;
  document.getElementById('g_grasa').value = Math.round(grasa*10)/10;
  document.getElementById('g_carb').value = Math.round(carb*10)/10;
  document.getElementById('g_fibra').value = Math.round(fibra*10)/10;
  warn.style.display = (carb < 100) ? 'inline' : 'none';
}

  if(!food || isNaN(rawVal) || rawVal<=0){ alert('Selecciona un alimento y una porción válida.'); return; }
  const portionG = (food.unidad_label && mode==='unidad') ? rawVal*food.unidad_gramos : rawVal;
  const portionLabel = (food.unidad_label && mode==='unidad') ? `${rawVal} ${food.unidad_label}${rawVal!=1?'s':''} (${round1(portionG)} g)` : `${portionG} g`;
  const factor = portionG/100;
  await sb.from('registro').insert({
    cliente_id: vCliente.id, fecha: vDate, comida: meal, alimento: food.nombre, porcion: portionLabel,
    kcal: food.kcal*factor, proteina: food.proteina*factor, carbohidratos: food.carbohidratos*factor,
    grasa: food.grasa*factor, fibra: food.fibra*factor,
  });
  await loadLogForDate(vDate);
}

async function deleteEntry(id){
  await sb.from('registro').delete().eq('id', id);
  await loadLogForDate(vDate);
}

function renderLog(){
  const meals = ['Desayuno','Almuerzo','Cena','Snack'];
  let html = '';
  meals.forEach(meal=>{
    const items = vEntries.filter(e=>e.comida===meal);
    if(items.length===0) return;
    html += `<tr><td colspan="8" class="meal-header">${meal}</td></tr>`;
    items.forEach(e=>{
      html += `<tr><td>${e.alimento}</td><td>${e.porcion}</td><td>${Math.round(e.kcal)}</td><td>${round1(e.proteina)}</td><td>${round1(e.carbohidratos)}</td><td>${round1(e.grasa)}</td><td>${round1(e.fibra)}</td><td><button class="small secondary" onclick="deleteEntry('${e.id}')">×</button></td></tr>`;
    });
    const sub = items.reduce((a,e)=>({kcal:a.kcal+e.kcal,prot:a.prot+e.proteina,carb:a.carb+e.carbohidratos,grasa:a.grasa+e.grasa,fibra:a.fibra+e.fibra}), {kcal:0,prot:0,carb:0,grasa:0,fibra:0});
    html += `<tr style="background:var(--surface);font-weight:600;"><td colspan="2" style="text-align:right;">Subtotal</td><td>${Math.round(sub.kcal)}</td><td>${round1(sub.prot)}</td><td>${round1(sub.carb)}</td><td>${round1(sub.grasa)}</td><td>${round1(sub.fibra)}</td><td></td></tr>`;
  });
  document.getElementById('logTableBody').innerHTML = html || '<tr><td colspan="8" class="muted">Sin registros este día.</td></tr>';
}

function computeTotals(){
  return vEntries.reduce((a,e)=>({kcal:a.kcal+e.kcal,prot:a.prot+e.proteina,carb:a.carb+e.carbohidratos,grasa:a.grasa+e.grasa,fibra:a.fibra+e.fibra}), {kcal:0,prot:0,carb:0,grasa:0,fibra:0});
}

function renderProgress(){
  const totals = computeTotals();
  const items = [
    {name:'Calorías', unit:'kcal', val:totals.kcal, goal:vGoals.kcal, color:'#111111'},
    {name:'Proteína', unit:'g', val:totals.prot, goal:vGoals.proteina, color:'#D64545'},
    {name:'Carbohidratos', unit:'g', val:totals.carb, goal:vGoals.carbohidratos, color:'#3B6EA5'},
    {name:'Grasa', unit:'g', val:totals.grasa, goal:vGoals.grasa, color:'#D9A72E'},
    {name:'Fibra', unit:'g', val:totals.fibra, goal:vGoals.fibra, color:'#4C8C5C'},
  ];
  document.getElementById('progressWrap').innerHTML = items.map(it=>{
    const pct = it.goal>0 ? Math.min(100,(it.val/it.goal)*100) : 0;
    const rem = it.goal - it.val;
    const status = it.goal<=0 ? '' : (rem>=0 ? `faltan ${round1(rem)} ${it.unit}` : `${round1(-rem)} ${it.unit} sobre la meta`);
    return `<div style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px;"><b>${it.name}</b><span>${round1(it.val)} / ${it.goal} ${it.unit} · ${status}</span></div>
      <div style="background:var(--surface);border-radius:3px;height:8px;overflow:hidden;"><div style="height:100%;width:${pct}%;background:${it.color};"></div></div>
    </div>`;
  }).join('');
}

function renderCharts(){
  const totals = computeTotals();
  const kp = totals.prot*4, kc = totals.carb*4, kf = totals.grasa*9;
  const mCtx = document.getElementById('macroChart'), kCtx = document.getElementById('kcalChart');
  if(!mCtx || typeof Chart==='undefined') return;
  if(macroChart) macroChart.destroy();
  if(kcalChart) kcalChart.destroy();
  const hasData = (kp+kc+kf)>0;
  macroChart = new Chart(mCtx, { type:'doughnut', data:{ labels:['Proteína','Carbohidratos','Grasa'], datasets:[{ data: hasData?[kp,kc,kf]:[1,1,1], backgroundColor:['#D64545','#3B6EA5','#D9A72E'], borderWidth:0 }]}, options:{ responsive:true, maintainAspectRatio:false, cutout:'62%', plugins:{ legend:{display:false}, tooltip:{enabled:hasData} } } });
  const rem = Math.max(0, vGoals.kcal - totals.kcal);
  kcalChart = new Chart(kCtx, { type:'doughnut', data:{ labels:['Consumidas','Restantes'], datasets:[{ data: vGoals.kcal>0 ? [totals.kcal, rem] : [totals.kcal,0], backgroundColor:[totals.kcal>vGoals.kcal && vGoals.kcal>0 ? '#767672':'#111111','#EDEDE8'], borderWidth:0 }]}, options:{ responsive:true, maintainAspectRatio:false, cutout:'62%', plugins:{ legend:{display:false} } } });
  const lg = (items)=> items.map(([c,t])=>`<span><i style="background:${c}"></i>${t}</span>`).join('');
  document.getElementById('macroLegend').innerHTML = lg([['#D64545','Proteína'],['#3B6EA5','Carbohidratos'],['#D9A72E','Grasa']]);
  document.getElementById('kcalLegend').innerHTML = lg([[totals.kcal>vGoals.kcal && vGoals.kcal>0 ? '#767672':'#111111','Consumidas'],['#EDEDE8','Restantes']]);
  renderHistoryChart();
}

async function renderHistoryChart(){
  const ctx = document.getElementById('historyChart');
  if(!ctx || typeof Chart==='undefined') return;
  const base = new Date(vDate+'T00:00:00');
  const days = [];
  for(let i=6;i>=0;i--){ const d=new Date(base); d.setDate(d.getDate()-i); days.push(toDateStr(d)); }
  let kcalByDay;
  if(vHistoryPrecomputed){
    kcalByDay = vHistoryPrecomputed;
    vHistoryPrecomputed = null;
  } else {
    const otherDays = days.filter(d=>d!==vDate);
    const results = await Promise.all(otherDays.map(d=> sb.from('registro').select('kcal').eq('cliente_id', vCliente.id).eq('fecha', d)));
    const byDate = {};
    otherDays.forEach((d,i)=>{ byDate[d] = results[i].data || []; });
    kcalByDay = days.map(d=>{
      const entries = d===vDate ? vEntries : byDate[d];
      return Math.round(entries.reduce((s,e)=>s+e.kcal,0));
    });
  }
  const labels = days.map(d=> new Date(d+'T00:00:00').toLocaleDateString('es-CO',{weekday:'short',day:'numeric'}));
  if(historyChart) historyChart.destroy();
  const isMobileHist = window.matchMedia('(max-width:640px)').matches;
  historyChart = new Chart(ctx, { type:'bar', data:{ labels, datasets:[
    { label:'Kcal', data:kcalByDay, backgroundColor: days.map(d=> d===vDate ? '#111111':'#D8D7D1') },
    ...(vGoals.kcal>0 ? [{ label:'Meta', data: days.map(()=>vGoals.kcal), type:'line', borderColor:'#767672', borderDash:[5,4], pointRadius:0 }] : [])
  ]}, options:{ maintainAspectRatio: !isMobileHist, plugins:{legend:{position:'bottom',labels:{font:{size:10}}}}, scales:{y:{beginAtZero:true}},
    onClick:(evt,els)=>{ if(els.length){ const idx=els[0].index; document.getElementById('logDate').value=days[idx]; vDate=days[idx]; loadLogForDate(vDate); } } } });
}

// ---------- Notas ----------
function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderNotesFromData(tipo, data, error){
  const listEl = document.getElementById(tipo==='perfil' ? 'profileNotesList' : 'dayNotesList');
  if(!listEl) return;
  if(error){ listEl.innerHTML = `<p class="error">No se pudieron cargar las notas: ${error.message}</p>`; return; }
  if(!data || data.length===0){ listEl.innerHTML = '<p class="muted" style="margin:0 0 10px;">Aún no hay notas guardadas.</p>'; return; }
  listEl.innerHTML = data.map(n=>{
    const when = new Date(n.created_at).toLocaleString('es-CO',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
    return `<div class="note-item"><div><div class="when">${when}</div><div class="txt">${escHtml(n.nota||'')}</div></div><button class="small secondary" onclick="deleteNote('${n.id}','${tipo}')">×</button></div>`;
  }).join('');
}

async function loadNotes(tipo){
  const listEl = document.getElementById(tipo==='perfil' ? 'profileNotesList' : 'dayNotesList');
  if(!listEl) return;
  let q = sb.from('notas').select('*').eq('cliente_id', vCliente.id).eq('tipo', tipo).order('created_at', {ascending:false});
  if(tipo==='dia') q = q.eq('fecha', vDate);
  const { data, error } = await q;
  renderNotesFromData(tipo, data, error);
}

// ---------- Peso ----------
async function loadWeights(){
  const { data } = await sb.from('pesos').select('*').eq('cliente_id', vCliente.id).order('fecha');
  vWeights = data || [];
  document.getElementById('weightDate').value = vDate;
  renderWeightList();
  renderWeightChart();
}

async function addWeight(){
  const d = document.getElementById('weightDate').value;
  const peso = parseFloat(document.getElementById('weightInput').value);
  if(!d || isNaN(peso) || peso<=0){ alert('Escribe una fecha y un peso válido.'); return; }
  const existing = vWeights.find(w=>w.fecha===d);
  if(existing){ await sb.from('pesos').update({ peso }).eq('id', existing.id); }
  else { await sb.from('pesos').insert({ cliente_id: vCliente.id, fecha:d, peso }); }
  document.getElementById('weightInput').value = '';
  await loadWeights();
}

async function deleteWeight(id){
  await sb.from('pesos').delete().eq('id', id);
  await loadWeights();
}

function mondayOf(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const day = (d.getDay()+6)%7;
  d.setDate(d.getDate()-day);
  return toDateStr(d);
}

function computeWeeklyAverages(list){
  const groups = {};
  list.forEach(w=>{ const key=mondayOf(w.fecha); (groups[key]=groups[key]||[]).push(w.peso); });
  return Object.keys(groups).sort().map(key=>{
    const vals = groups[key];
    const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
    const label = new Date(key+'T00:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'short'});
    return { key, label, avg, count: vals.length };
  });
}

function renderWeightList(){
  const wrap = document.getElementById('weightListWrap');
  const note = document.getElementById('weightAvgNote');
  if(vWeights.length===0){ wrap.innerHTML='<p class="muted">Aún no hay pesajes registrados.</p>'; note.textContent=''; return; }
  const desc = [...vWeights].sort((a,b)=>b.fecha.localeCompare(a.fecha));
  let html = '<div class="scroll" style="max-height:200px;"><table><thead><tr><th>Fecha</th><th>Peso (kg)</th><th></th></tr></thead><tbody>';
  desc.forEach(w=>{ html += `<tr><td>${w.fecha}</td><td>${w.peso}</td><td><button class="small secondary" onclick="deleteWeight('${w.id}')">×</button></td></tr>`; });
  html += '</tbody></table></div>';
  wrap.innerHTML = html;
  const weekly = computeWeeklyAverages(vWeights);
  if(weekly.length>0){
    const last = weekly[weekly.length-1];
    note.textContent = `Promedio de la semana del ${last.label}: ${last.avg.toFixed(1)} kg (${last.count} ${last.count===1?'medición':'mediciones'}).`;
  } else { note.textContent=''; }
}

// ---------- Progreso (solo lectura: peso corporal + ejercicios) ----------
async function renderProgresoTab(){
  document.getElementById('clienteTabContent').innerHTML = loadingHtml();

  const [[pesosRes, histRes]] = await Promise.all([
    Promise.all([
      sb.from('pesos').select('*').eq('cliente_id', vCliente.id).order('fecha'),
      sb.from('registro_entreno').select('ejercicio_id, fecha, peso, ejercicios(nombre, grupo_muscular)').eq('cliente_id', vCliente.id)
    ]),
    minDelay(TAB_LOADING_MIN_MS)
  ]);

  vWeights = pesosRes.data || [];
  vProgresoEjercicios = {};
  (histRes.data || []).forEach(h=>{
    if(h.peso == null) return;
    if(!vProgresoEjercicios[h.ejercicio_id]){
      vProgresoEjercicios[h.ejercicio_id] = { id:h.ejercicio_id, nombre: h.ejercicios ? h.ejercicios.nombre : h.ejercicio_id, grupo: h.ejercicios ? h.ejercicios.grupo_muscular : '', rows:[] };
    }
    vProgresoEjercicios[h.ejercicio_id].rows.push(h);
  });

  const exList = Object.values(vProgresoEjercicios);
  const gruposConDatos = [...new Set([...GRUPOS_MUSCULARES, ...exList.map(e=>e.grupo)])].sort((a,b)=>a.localeCompare(b)).filter(g=>exList.some(e=>e.grupo===g));

  document.getElementById('clienteTabContent').innerHTML = `
    <h2>Progreso</h2>
    <div class="tabs" id="progresoSubTabs">
      <button class="tab-btn active" style="flex:1;" onclick="switchProgresoSub('peso',this)">Peso corporal</button>
      <button class="tab-btn" style="flex:1;" onclick="switchProgresoSub('ejercicios',this)">Ejercicios</button>
    </div>
    <div id="progresoPeso">
      <div class="chart-wrap-wide"><canvas id="progresoPesoChart" height="90"></canvas></div>
    </div>
    <div id="progresoEjercicios" style="display:none;">
      ${exList.length ? `
        <select id="progresoExSelect" onchange="renderProgresoExChart(this.value)">
          ${gruposConDatos.map(g=>`<optgroup label="${g}">${exList.filter(e=>e.grupo===g).sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(e=>`<option value="${e.id}">${e.nombre}</option>`).join('')}</optgroup>`).join('')}
        </select>
        <div class="chart-wrap-wide"><canvas id="progresoExChart" height="90"></canvas></div>
      ` : `<p class="muted">Todavía no hay series registradas en ningún ejercicio.</p>`}
    </div>
  `;

  renderProgresoPesoChart();
  if(exList.length) renderProgresoExChart(document.getElementById('progresoExSelect').value);
}

function switchProgresoSub(which, btn){
  document.querySelectorAll('#progresoSubTabs .tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('progresoPeso').style.display = which==='peso' ? '' : 'none';
  document.getElementById('progresoEjercicios').style.display = which==='ejercicios' ? '' : 'none';
}

function renderProgresoPesoChart(){
  const ctx = document.getElementById('progresoPesoChart');
  if(!ctx || typeof Chart==='undefined') return;
  const weekly = computeWeeklyAverages(vWeights);
  if(progresoPesoChartObj) progresoPesoChartObj.destroy();
  if(weekly.length===0) return;
  const isMobile = window.matchMedia('(max-width:640px)').matches;
  progresoPesoChartObj = new Chart(ctx, { type:'line', data:{ labels:weekly.map(w=>w.label), datasets:[{ label:'Promedio semanal (kg)', data:weekly.map(w=>Math.round(w.avg*10)/10), borderColor:'#111111', backgroundColor:'#111111', tension:0.25, pointRadius:4 }]}, options:{ maintainAspectRatio: !isMobile, plugins:{legend:{display:false}} } });
}

function renderProgresoExChart(ejercicioId){
  const ctx = document.getElementById('progresoExChart');
  if(!ctx || typeof Chart==='undefined') return;
  const ex = vProgresoEjercicios[ejercicioId];
  if(progresoExChartObj) progresoExChartObj.destroy();
  if(!ex) return;
  const byFecha = {};
  ex.rows.forEach(r=>{
    if(!byFecha[r.fecha] || r.peso > byFecha[r.fecha]) byFecha[r.fecha] = r.peso;
  });
  const fechas = Object.keys(byFecha).sort();
  const isMobile = window.matchMedia('(max-width:640px)').matches;
  progresoExChartObj = new Chart(ctx, { type:'line', data:{ labels: fechas.map(f=> new Date(f+'T00:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'short'})), datasets:[{ label:'Peso máx. (kg)', data: fechas.map(f=>byFecha[f]), borderColor:'#111111', backgroundColor:'#111111', tension:0.25, pointRadius:4 }]}, options:{ maintainAspectRatio: !isMobile, plugins:{legend:{display:false}} } });
}

function renderWeightChart(){
  const ctx = document.getElementById('weightChart');
  if(!ctx || typeof Chart==='undefined') return;
  const weekly = computeWeeklyAverages(vWeights);
  if(weightChart) weightChart.destroy();
  if(weekly.length===0) return;
  const isMobileWt = window.matchMedia('(max-width:640px)').matches;
  weightChart = new Chart(ctx, { type:'line', data:{ labels:weekly.map(w=>w.label), datasets:[{ label:'Promedio semanal (kg)', data:weekly.map(w=>Math.round(w.avg*10)/10), borderColor:'#111111', backgroundColor:'#111111', tension:0.25, pointRadius:4 }]}, options:{ maintainAspectRatio: !isMobileWt, plugins:{legend:{display:false}} } });
}
